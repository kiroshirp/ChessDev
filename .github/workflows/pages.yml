name: Publish ChessDev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /ChessDev/
          VITE_API_URL: https://pixelspace-world.onrender.com/api
          VITE_WORLD_URL: https://pixelspace-world.onrender.com
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:public
        env:
          VITE_API_URL: https://pixelspace-world.onrender.com/api
          VITE_WORLD_URL: https://pixelspace-world.onrender.com
      - run: npm run test:pages
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

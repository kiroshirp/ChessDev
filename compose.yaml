# Local development only. Cloudflare D1/Containers deployment is documented in docs/deployment.md.
services:
  api:
    build: { context: ., dockerfile: infrastructure/Dockerfile }
    command: npm run dev -w @pixelspace/api
    environment: { HOST: 0.0.0.0, API_PORT: 3001, SQLITE_PATH: /app/.local/pixelspace.sqlite }
    ports: ['127.0.0.1:3001:3001']
    volumes: ['local_data:/app/.local']
  world-server:
    build: { context: ., dockerfile: infrastructure/Dockerfile }
    command: npm run dev -w @pixelspace/world-server
    environment: { HOST: 0.0.0.0, WORLD_PORT: 2567, API_URL: 'http://api:3001' }
    ports: ['127.0.0.1:2567:2567']
    depends_on: [api]
  web:
    build: { context: ., dockerfile: infrastructure/Dockerfile }
    command: npm run dev -w @pixelspace/web -- --host 0.0.0.0
    ports: ['127.0.0.1:5173:5173']
volumes:
  local_data:
